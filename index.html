<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="header">
            <h1 class="logo">
                My Web-Site
            </h1>
            <a href="https://mxx567.github.io/webtech1-assignment4">Part 1</a>
            <a href="https://mxx567.github.io/webtech1-assignment4/part2/">Part 2</a>
            <a href="https://mxx567.github.io/webtech1-assignment4/part3/">Part 3</a>
        </nav>
        <main class="contact-card">
            <div class="heading">
                <h1>Form</h1>
            </div>
            <p class="intro">Please fill out this form bellow.</p>

            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        autocomplete="name"
                        minlength="2"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Type Message Here"
                        minlength="10"
                        maxlength="500"
                        required
                    ></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </main>
    </body>
</html>
