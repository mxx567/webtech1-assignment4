<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 justify-content-center">
                <form class="bg-white border rounded p-4 needs-validation">
                    <h1 class="h3 mb-4">Form</h1>
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label">Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="Your name"
                                minlength="2"
                                maxlength="50"
                                value="Maksat"
                                required
                            >
                            <div class="valid-feedback">Valid.</div>
                            <div class="invalid-feedback">Please fill out this field.</div>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="you@example.com"
                                aria-describedby="emailHelp"
                                required
                                value="somemailnoat.com"
                            >
                            <div class="valid-feedback">Valid.</div>
                            <div class="invalid-feedback">Please fill out this field.</div>
                        </div>

                        <div class="col-12">
                            <label for="message" class="form-label">Message</label>
                            <textarea
                                class="form-control"
                                id="message"
                                name="message"
                                rows="4"
                                placeholder="Write your message"
                                minlength="16"
                                maxlength="1024"
                                aria-describedby="messageHelp"
                                required
                            ></textarea>
                            <div id="messageHelp" class="form-text">
                                Write between 16 and 1024 characters.
                            </div>
                        </div>

                        <div class="col-12 center">
                            <button type="submit" class="btn btn-dark">
                                Send message
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
